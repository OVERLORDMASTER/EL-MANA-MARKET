<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>Consulta Costo y Venta — El Maná Market</title>
  <meta name="description"
    content="Módulo interno de consulta rápida de costos de compra, precios de venta y márgenes de ganancia en El Maná Market." />
  <link rel="icon" type="image/png" href="imagen/logo.png" />

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      /* Colores Oficiales El Maná Market */
      --logo-navy-950: #081a30;
      --logo-navy-900: #0e2646;
      --logo-navy-850: #11325d;
      --logo-navy-800: #163b6b;
      --logo-navy-700: #1d4b85;

      --logo-blue-cart: #48a2df;
      --logo-cyan-400: #38bdf8;
      --logo-cyan-300: #7dd3fc;
      --logo-cyan-200: #bae6fd;
      --logo-cyan-100: #e0f2fe;
      --logo-cyan-50: #f0f9ff;

      --accent-green-600: #059669;
      --accent-green-500: #10b981;
      --accent-green-100: #d1fae5;
      --accent-green-50: #ecfdf5;

      --accent-red-600: #dc2626;
      --accent-red-500: #ef4444;
      --accent-red-100: #fee2e2;
      --accent-red-50: #fef2f2;

      --accent-amber-600: #d97706;
      --accent-amber-500: #f59e0b;
      --accent-amber-100: #fef3c7;
      --accent-amber-50: #fffbeb;

      --accent-purple: #7c3aed;

      /* Fondo y atmósfera */
      --bg-body-base: #e6f3fc;
      --bg-card: #ffffff;
      --bg-card-hover: #f9fdff;
      --bg-glass: rgba(255, 255, 255, 0.94);

      --text-main: #0e2646;
      --text-muted: #4b6685;
      --text-light: #7e9bb9;

      --border-soft: #c8e4f8;
      --border-brand: #7bc5f3;
      --border-focus: #38bdf8;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;

      --shadow-sm: 0 4px 14px rgba(17, 50, 93, 0.06);
      --shadow-md: 0 8px 26px rgba(17, 50, 93, 0.10);
      --shadow-lg: 0 16px 40px rgba(17, 50, 93, 0.14);
      --shadow-glow: 0 0 25px rgba(72, 162, 223, 0.35);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      position: relative;
      background-color: var(--bg-body-base);
      background-image:
        radial-gradient(circle at 10% 0%, rgba(72, 162, 223, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 90% 0%, rgba(56, 189, 248, 0.30) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(224, 242, 254, 0.55) 0%, transparent 70%),
        radial-gradient(circle at 0% 100%, rgba(72, 162, 223, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(14, 165, 233, 0.25) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    h1, h2, h3, h4, .brand-font {
      font-family: 'Outfit', sans-serif;
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #dbeffe;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--logo-blue-cart);
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--logo-navy-850);
    }

    /* ==========================================================================
       HEADER COMPACTO & MINIMALISTA
       ========================================================================== */
    .app-header {
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 2px solid var(--border-brand);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 22px rgba(72, 162, 223, 0.16);
      width: 100%;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(17, 50, 93, 0.2));
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
    }

    .brand-main-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--logo-navy-950);
      letter-spacing: -0.3px;
      line-height: 1.15;
    }

    .brand-badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--logo-navy-850);
      background: var(--logo-cyan-100);
      padding: 0.1rem 0.5rem;
      border-radius: var(--radius-full);
      width: fit-content;
      margin-top: 2px;
    }

    /* Header Controls (BCV + Botón Recargar) */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* Tasa BCV Widget */
    .bcv-pill {
      background: linear-gradient(135deg, #ffffff 0%, var(--logo-cyan-50) 100%);
      border: 1.5px solid var(--border-brand);
      border-radius: var(--radius-md);
      padding: 0.35rem 0.75rem;
      box-shadow: 0 4px 12px rgba(72, 162, 223, 0.12);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      user-select: none;
    }

    .bcv-pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green-500);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: bcvPulse 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
      flex-shrink: 0;
    }

    @keyframes bcvPulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .bcv-text-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .bcv-label-small {
      font-size: 0.64rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .bcv-value-strong {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--logo-navy-950);
    }

    .btn-refresh {
      background: #ffffff;
      border: 1.5px solid var(--border-brand);
      color: var(--logo-navy-850);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(72, 162, 223, 0.12);
    }

    .btn-refresh:hover {
      background: var(--logo-cyan-50);
      border-color: var(--logo-blue-cart);
      transform: translateY(-1px);
    }

    .btn-refresh:active {
      transform: translateY(0);
    }

    .btn-refresh.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* ==========================================================================
       BARRA DE BÚSQUEDA Y CONTROLES PRINCIPALES (STICKY SECUNDARIO)
       ========================================================================== */
    .controls-panel {
      max-width: 1400px;
      margin: 1.2rem auto 0 auto;
      padding: 0 1.25rem;
      width: 100%;
    }

    .search-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .search-bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .search-input-group {
      position: relative;
      flex: 1 1 320px;
      display: flex;
      align-items: center;
    }

    .search-input-group .search-icon {
      position: absolute;
      left: 1rem;
      font-size: 1.15rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-field {
      width: 100%;
      height: 48px;
      padding: 0 2.8rem 0 3rem;
      background: var(--logo-cyan-50);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-full);
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--logo-navy-950);
      outline: none;
      transition: all 0.22s ease;
      font-family: inherit;
    }

    .search-field:focus {
      background: #ffffff;
      border-color: var(--logo-blue-cart);
      box-shadow: 0 0 0 4px rgba(72, 162, 223, 0.2);
    }

    .search-field::placeholder {
      color: var(--text-light);
      font-weight: 500;
    }

    .search-clear-btn {
      position: absolute;
      right: 0.85rem;
      background: var(--border-soft);
      border: none;
      color: var(--logo-navy-850);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 0.82rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .search-clear-btn:hover {
      background: var(--logo-blue-cart);
      color: #ffffff;
    }

    /* Filtros rápidos y orden */
    .filter-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .quick-status-filters {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .status-filter-btn {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .status-filter-btn:hover {
      background: var(--logo-cyan-50);
      border-color: var(--logo-brand);
      color: var(--logo-navy-850);
    }

    .status-filter-btn.active {
      background: var(--logo-navy-850);
      color: #ffffff;
      border-color: var(--logo-navy-850);
    }

    .sort-and-view-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .sort-select {
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      color: var(--logo-navy-850);
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 700;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .sort-select:focus {
      border-color: var(--logo-blue-cart);
    }

    .view-toggle-group {
      display: flex;
      background: var(--logo-cyan-50);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 2px;
    }

    .btn-view-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.65rem;
      border-radius: calc(var(--radius-md) - 2px);
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-view-toggle.active {
      background: #ffffff;
      color: var(--logo-navy-950);
      box-shadow: 0 2px 6px rgba(17, 50, 93, 0.1);
    }

    /* Conteo y estadísticas rápidas */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
      padding-top: 0.3rem;
      border-top: 1px dashed var(--border-soft);
    }

    .stats-bar strong {
      color: var(--logo-navy-950);
      font-weight: 800;
    }

    /* Categorías Chips Horizontal Scroll */
    .categories-section {
      max-width: 1400px;
      margin: 1rem auto 0 auto;
      padding: 0 1.25rem;
      width: 100%;
    }

    .categories-scroll {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding: 0.3rem 0 0.8rem 0;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .category-chip {
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      color: var(--logo-navy-850);
      padding: 0.45rem 0.95rem;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 6px rgba(72, 162, 223, 0.08);
      user-select: none;
      flex-shrink: 0;
    }

    .category-chip:hover {
      border-color: var(--logo-blue-cart);
      background: var(--logo-cyan-50);
      transform: translateY(-2px);
    }

    .category-chip.active {
      background: linear-gradient(135deg, var(--logo-navy-950) 0%, var(--logo-navy-850) 100%);
      color: #ffffff;
      border-color: var(--logo-navy-950);
      box-shadow: 0 4px 14px rgba(17, 50, 93, 0.25);
    }

    .category-chip .chip-count {
      font-size: 0.72rem;
      font-weight: 800;
      background: var(--logo-cyan-100);
      color: var(--logo-navy-850);
      padding: 0.1rem 0.45rem;
      border-radius: var(--radius-full);
    }

    .category-chip.active .chip-count {
      background: var(--logo-blue-cart);
      color: var(--logo-navy-950);
    }

    /* ==========================================================================
       CONTENEDOR DE PRODUCTOS Y VISTA GRID
       ========================================================================== */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.5rem 1.25rem 3rem 1.25rem;
      width: 100%;
      flex: 1;
    }

    /* Grid Centrado */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.15rem;
      width: 100%;
    }

    /* Tarjeta de Producto */
    .product-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 16px rgba(72, 162, 223, 0.08);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--logo-blue-cart);
      box-shadow: 0 10px 26px rgba(72, 162, 223, 0.2);
      background: var(--bg-card-hover);
    }

    .card-header-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .card-category-badge {
      font-size: 0.72rem;
      font-weight: 800;
      background: var(--logo-cyan-50);
      color: var(--logo-navy-850);
      border: 1px solid var(--border-brand);
      padding: 0.18rem 0.6rem;
      border-radius: var(--radius-full);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }

    .card-id-badge {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-light);
      background: #f1f5f9;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
    }

    .product-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--logo-navy-950);
      line-height: 1.35;
      margin-bottom: 0.85rem;
      min-height: 2.7rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    /* Comparativa de Precios: Costo vs Venta */
    .prices-dual-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-bottom: 0.85rem;
    }

    .price-col {
      padding: 0.6rem 0.7rem;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      border: 1.5px solid transparent;
    }

    /* Columna de Costo / Compra */
    .col-costo {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .col-costo .price-role-label {
      color: #475569;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .col-costo .price-usd {
      font-family: 'Outfit', sans-serif;
      font-size: 1.22rem;
      font-weight: 900;
      color: #334155;
      line-height: 1;
    }

    .col-costo .price-ves {
      font-size: 0.78rem;
      font-weight: 800;
      color: #64748b;
      line-height: 1.1;
      margin-top: 2px;
    }

    /* Columna de Venta al Público */
    .col-venta {
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
      border-color: #86efac;
    }

    .col-venta .price-role-label {
      color: #047857;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .col-venta .price-usd {
      font-family: 'Outfit', sans-serif;
      font-size: 1.28rem;
      font-weight: 900;
      color: var(--accent-green-600);
      line-height: 1;
    }

    .col-venta .price-ves {
      font-size: 0.78rem;
      font-weight: 800;
      color: #0284c7;
      line-height: 1.1;
      margin-top: 2px;
    }

    /* Banner de Margen y Ganancia */
    .margin-banner {
      border-radius: var(--radius-sm);
      padding: 0.55rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .margin-banner.profit-positive {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .margin-banner.profit-neutral {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
    }

    .margin-banner.profit-negative {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .margin-banner.profit-missing {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
    }

    .margin-val-usd {
      font-family: 'Outfit', sans-serif;
      font-size: 0.96rem;
      font-weight: 900;
    }

    .margin-pct-pill {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }

    .profit-positive .margin-pct-pill {
      background: #dcfce7;
      color: #15803d;
    }

    .profit-negative .margin-pct-pill {
      background: #fee2e2;
      color: #b91c1c;
    }

    .profit-missing .margin-pct-pill {
      background: #fef3c7;
      color: #b45309;
    }

    /* ==========================================================================
       VISTA EN TABLA COMPACTA (HOJA DE CÁLCULO)
       ========================================================================== */
    .table-container {
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-md);
      overflow-x: auto;
      box-shadow: var(--shadow-md);
      width: 100%;
    }

    .products-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    .products-table th {
      background: #f8fafc;
      color: var(--logo-navy-950);
      font-weight: 800;
      padding: 0.85rem 1rem;
      border-bottom: 2px solid var(--border-brand);
      white-space: nowrap;
    }

    .products-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }

    .products-table tbody tr:hover {
      background: var(--logo-cyan-50);
    }

    /* Loading and Empty State */
    .state-box {
      background: #ffffff;
      border: 2px dashed var(--border-brand);
      border-radius: var(--radius-lg);
      padding: 3.5rem 1.5rem;
      text-align: center;
      max-width: 600px;
      margin: 2rem auto;
      box-shadow: var(--shadow-sm);
    }

    .state-icon {
      font-size: 3rem;
      margin-bottom: 0.8rem;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border-soft);
      border-top-color: var(--logo-blue-cart);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.2rem auto;
    }

    /* Footer Sencillo */
    .site-footer {
      background: #ffffff;
      border-top: 1.5px solid var(--border-soft);
      padding: 1.25rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: auto;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      .brand-main-title {
        font-size: 1.15rem;
      }
      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <header class="app-header">

            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />

  <!-- ==========================================================================

            <option value="venta_desc">Mayor Precio Venta ($)</option>

      <!-- Filtro Rápido por Estado de Costo y Contador -->

        <div class="stats-bar" style="border:none; padding:0;">

  <!-- ==========================================================================
       FILTRO HORIZONTAL POR CATEGORÍAS (CHIPS)

        <span>Todas</span>

  <!-- ==========================================================================
       CONTENIDO DINÁMICO: CATÁLOGO DE PRODUCTOS
       ========================================================================== -->
  <main class="main-content">
    <div id="productsViewContainer">
      <!-- Estado Inicial de Carga -->
      <div class="state-box">
        <div class="spinner"></div>
        <h3 style="color:var(--logo-navy-950); margin-bottom:0.4rem;">Cargando catálogo...</h3>
        <p style="color:var(--text-muted); font-size:0.9rem;">Consultando costos y precios en tiempo real.</p>
      </div>
    </div>
  </main>

  <!-- ==========================================================================
       PIE DE PÁGINA
       ========================================================================== -->
  <footer class="site-footer">
    <div>
      © <span id="currentYear"></span> <strong>El Maná Market</strong> — Consulta Interna de Costo y Venta
    </div>
  </footer>

  <!-- ==========================================================================
       LÓGICA JAVASCRIPT
       ========================================================================== -->
  <script>
    // Configuración de Supabase
    const SUPABASE_URL = 'https://lzqdhdvkwiinocmrrwjn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BoRLHezGfOx1q-JBGty8WQ_NzNm01Gv';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Estado Global
    const state = {
      productos: [],
      categorias: [],
      categoriaActiva: 'ALL',
      filtroCosto: 'all', // 'all', 'with_cost', 'without_cost'
      busqueda: '',
      orden: 'nombre_asc',
      vista: 'grid', // 'grid' o 'table'
      tasaBcv: 0,
      tasaFecha: ''
    };

    // =========================================================================
    // UTILIDADES DE FORMATEO (USD & BOLÍVARES)
    // =========================================================================
    function formatearBs(monto) {
      if (isNaN(monto) || monto === null || monto === undefined) return 'Bs. 0,00';
      const num = Number(monto);
      const partes = num.toFixed(2).split('.');
      partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return 'Bs. ' + partes.join(',');
    }

    function formatearUsd(monto) {
      if (isNaN(monto) || monto === null || monto === undefined) return '$0.00';
      return '$' + Number(monto).toFixed(2);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // =========================================================================
    // SERVICIO: TASA BCV OFICIAL
    // =========================================================================
    async function obtenerTasaBCV() {
      // 1. Leer caché para respuesta instantánea
      const cached = localStorage.getItem('mana_bcv_rate');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed && typeof parsed.rate === 'number' && parsed.rate > 0) {
            state.tasaBcv = parsed.rate;
            actualizarUIBCV();
          }
        } catch (e) {
          console.warn('Error al leer caché BCV:', e);
        }
      }

      // 2. Consulta en vivo a la API
      try {
        const response = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (data && typeof data.promedio === 'number' && data.promedio > 0) {
          state.tasaBcv = data.promedio;
          state.tasaFecha = data.fechaActualizacion || new Date().toISOString();

          localStorage.setItem('mana_bcv_rate', JSON.stringify({
            rate: state.tasaBcv,
            fecha: state.tasaFecha,
            timestamp: Date.now()
          }));

          actualizarUIBCV();
          if (state.productos.length > 0) {
            renderizarVista();
          }
        }
      } catch (err) {
        console.warn('Aviso: Falló consulta a API BCV en vivo:', err);
        if (!state.tasaBcv) {
          state.tasaBcv = 798.33; // Tasa referencial de contingencia
        }
        actualizarUIBCV();
      }
    }

    function actualizarUIBCV() {
      const el = document.getElementById('bcvRateDisplay');
      if (el) {
        el.textContent = state.tasaBcv > 0 ? `${formatearBs(state.tasaBcv)} / $` : 'Calculando...';
      }
    }

    // =========================================================================
    // CARGAR PRODUCTOS DESDE SUPABASE
    // =========================================================================
    async function cargarProductos() {
      const btnReload = document.getElementById('btnReload');
      if (btnReload) btnReload.classList.add('spinning');

      try {
        const { data, error } = await _supabase
          .from('el_mana_market')
          .select('id, nombre, precio_venta, precio_compra, categoria, created_at')
          .order('categoria', { ascending: true })
          .order('nombre', { ascending: true });

        if (error) throw new Error('Error al conectar con Supabase: ' + error.message);
        if (!data || data.length === 0) throw new Error('No se encontraron productos en la base de datos.');

        const categoriasSet = new Set();
        const lista = data.map((fila, idx) => {
          const nombre = (fila.nombre || '').trim();
          const precioVenta = Number(fila.precio_venta) || 0;
          const precioCompra = (fila.precio_compra !== null && fila.precio_compra !== undefined && fila.precio_compra !== '')
            ? Number(fila.precio_compra)
            : null;

          let cat = (fila.categoria && String(fila.categoria).trim()) ? String(fila.categoria).trim() : 'General';
          categoriasSet.add(cat);

          // Cálculo de Margen / Ganancia
          let gananciaUsd = null;
          let gananciaPct = null;
          if (precioCompra !== null && precioCompra > 0) {
            gananciaUsd = precioVenta - precioCompra;
            gananciaPct = ((precioVenta - precioCompra) / precioCompra) * 100;
          }

          return {
            id: fila.id || idx + 1,
            nombre: nombre,
            categoria: cat,
            precioVenta: precioVenta,
            precioCompra: precioCompra,
            gananciaUsd: gananciaUsd,
            gananciaPct: gananciaPct
          };
        });

        state.productos = lista;
        state.categorias = Array.from(categoriasSet).sort((a, b) => a.localeCompare(b));

        const totalEl = document.getElementById('totalCountText');
        const chipTotal = document.getElementById('chipTotalCount');
        if (totalEl) totalEl.textContent = lista.length;
        if (chipTotal) chipTotal.textContent = lista.length;

        renderizarChipsCategorias();
        renderizarVista();
      } catch (err) {
        console.error('Error al cargar productos:', err);
        const container = document.getElementById('productsViewContainer');
        if (container) {
          container.innerHTML = `
            <div class="state-box" style="border-color:#f87171; background:#fef2f2;">
              <div class="state-icon">⚠️</div>
              <h3 style="color:#991b1b; margin-bottom:0.5rem;">Error al cargar datos</h3>
              <p style="color:#b91c1c; font-size:0.92rem; margin-bottom:1rem;">${escapeHtml(err.message)}</p>
              <button onclick="cargarProductos()" class="btn-refresh" style="background:#ffffff; margin:0 auto;">
                Reintentar
              </button>
            </div>
          `;
        }
      } finally {
        if (btnReload) btnReload.classList.remove('spinning');
      }
    }

    // =========================================================================
    // FILTRADO Y ORDENAMIENTO
    // =========================================================================
    function obtenerProductosFiltrados() {
      let items = [...state.productos];

      // 1. Filtrar por categoría
      if (state.categoriaActiva !== 'ALL') {
        items = items.filter(p => p.categoria.toLowerCase() === state.categoriaActiva.toLowerCase());
      }

      // 2. Filtrar por estado de costo
      if (state.filtroCosto === 'with_cost') {
        items = items.filter(p => p.precioCompra !== null && p.precioCompra > 0);
      } else if (state.filtroCosto === 'without_cost') {
        items = items.filter(p => p.precioCompra === null || p.precioCompra <= 0);
      }

      // 3. Filtrar por búsqueda de texto
      const q = state.busqueda.trim().toLowerCase();
      if (q) {
        items = items.filter(p =>
          p.nombre.toLowerCase().includes(q) ||
          p.categoria.toLowerCase().includes(q) ||
          String(p.id).includes(q)
        );
      }

      // 4. Ordenamiento
      switch (state.orden) {
        case 'nombre_desc':
          items.sort((a, b) => b.nombre.localeCompare(a.nombre));
          break;
        case 'venta_desc':
          items.sort((a, b) => b.precioVenta - a.precioVenta);
          break;
        case 'venta_asc':
          items.sort((a, b) => a.precioVenta - b.precioVenta);
          break;
        case 'costo_desc':
          items.sort((a, b) => (b.precioCompra || 0) - (a.precioCompra || 0));
          break;
        case 'costo_asc':
          items.sort((a, b) => (a.precioCompra || 0) - (b.precioCompra || 0));
          break;
        case 'margen_desc':
          items.sort((a, b) => (b.gananciaUsd || -9999) - (a.gananciaUsd || -9999));
          break;
        case 'margen_asc':
          items.sort((a, b) => (a.gananciaUsd || -9999) - (b.gananciaUsd || -9999));
          break;
        case 'nombre_asc':
        default:
          items.sort((a, b) => a.categoria.localeCompare(b.categoria) || a.nombre.localeCompare(b.nombre));
          break;
      }

      return items;
    }

    // =========================================================================
    // RENDERIZADO DE CHIPS DE CATEGORÍAS
    // =========================================================================
    function renderizarChipsCategorias() {
      const container = document.getElementById('categoriesChipsBar');
      if (!container) return;

      const conteos = {};
      state.productos.forEach(p => {
        conteos[p.categoria] = (conteos[p.categoria] || 0) + 1;
      });

      let html = `
        <button class="category-chip ${state.categoriaActiva === 'ALL' ? 'active' : ''}" data-category="ALL">
          <span>Todas</span>
          <span class="chip-count">${state.productos.length}</span>
        </button>
      `;

      state.categorias.forEach(cat => {
        const isActive = state.categoriaActiva === cat ? 'active' : '';
        html += `
          <button class="category-chip ${isActive}" data-category="${escapeHtml(cat)}">
            <span>${escapeHtml(cat)}</span>
            <span class="chip-count">${conteos[cat] || 0}</span>
          </button>
        `;
      });

      container.innerHTML = html;

      container.querySelectorAll('.category-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.categoriaActiva = btn.getAttribute('data-category');
          renderizarVista();
        });
      });
    }

    // =========================================================================
    // RENDERIZADO PRINCIPAL (GRID / TABLA)
    // =========================================================================
    function renderizarVista() {
      const container = document.getElementById('productsViewContainer');
      const visibleCountEl = document.getElementById('visibleCountText');
      const filtrados = obtenerProductosFiltrados();

      if (visibleCountEl) visibleCountEl.textContent = filtrados.length;

      if (filtrados.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <div class="state-icon">🔍</div>
            <h3 style="color:var(--logo-navy-950); margin-bottom:0.4rem;">No se encontraron productos</h3>
            <p style="color:var(--text-muted); font-size:0.92rem;">
              Prueba cambiando el término de búsqueda o seleccionando otra categoría.
            </p>
          </div>
        `;
        return;
      }

      if (state.vista === 'table') {
        renderizarModoTabla(container, filtrados);
      } else {
        renderizarModoGrid(container, filtrados);
      }
    }

    // Modo Tarjetas
    function renderizarModoGrid(container, items) {
      const tasa = state.tasaBcv > 0 ? state.tasaBcv : 0;

      let html = '<div class="products-grid">';

      items.forEach(prod => {
        const ventaBs = tasa > 0 ? formatearBs(prod.precioVenta * tasa) : 'Calculando...';
        const tieneCosto = prod.precioCompra !== null && prod.precioCompra > 0;
        const costoUsdTxt = tieneCosto ? formatearUsd(prod.precioCompra) : 'Sin costo';
        const costoBsTxt = tieneCosto && tasa > 0 ? formatearBs(prod.precioCompra * tasa) : (tieneCosto ? 'Calculando...' : 'Pendiente');

        // Estado del margen
        let marginBannerHtml = '';
        if (tieneCosto) {
          const ganUsd = prod.gananciaUsd;
          const ganBs = tasa > 0 ? formatearBs(ganUsd * tasa) : '';
          const pct = prod.gananciaPct.toFixed(1);

          if (ganUsd > 0) {
            marginBannerHtml = `
              <div class="margin-banner profit-positive">
                <div>
                  <span style="font-size:0.7rem; text-transform:uppercase; display:block; opacity:0.85;">Ganancia</span>
                  <span class="margin-val-usd">+${formatearUsd(ganUsd)}</span>
                  ${tasa > 0 ? `<span style="font-size:0.74rem; font-weight:800; opacity:0.9;"> (${ganBs})</span>` : ''}
                </div>
                <span class="margin-pct-pill">+${pct}% markup</span>
              </div>
            `;
          } else if (ganUsd === 0) {
            marginBannerHtml = `
              <div class="margin-banner profit-neutral">
                <span>Sin margen (Costo = Venta)</span>
                <span class="margin-pct-pill">0.0%</span>
              </div>
            `;
          } else {
            marginBannerHtml = `
              <div class="margin-banner profit-negative">
                <div>
                  <span style="font-size:0.7rem; text-transform:uppercase; display:block;">Pérdida</span>
                  <span class="margin-val-usd">${formatearUsd(ganUsd)}</span>
                </div>
                <span class="margin-pct-pill">${pct}%</span>
              </div>
            `;
          }
        } else {
          marginBannerHtml = `
            <div class="margin-banner profit-missing">
              <span>⚠️ Costo de compra no registrado</span>
              <span class="margin-pct-pill">Sin datos</span>
            </div>
          `;
        }

        html += `
          <div class="product-card" id="card-${prod.id}">
            <div>
              <div class="card-header-line">
                <span class="card-category-badge" title="${escapeHtml(prod.categoria)}">${escapeHtml(prod.categoria)}</span>
                <span class="card-id-badge">#${prod.id}</span>
              </div>
              <h3 class="product-title" title="${escapeHtml(prod.nombre)}">${escapeHtml(prod.nombre)}</h3>
            </div>

            <div>
              <div class="prices-dual-box">
                <!-- Costo de Compra -->
                <div class="price-col col-costo">
                  <span class="price-role-label">📥 Costo Compra</span>
                  <span class="price-usd">${costoUsdTxt}</span>
                  <span class="price-ves">${costoBsTxt}</span>
                </div>

                <!-- Precio de Venta -->
                <div class="price-col col-venta">
                  <span class="price-role-label">🛒 Precio Venta</span>
                  <span class="price-usd">${formatearUsd(prod.precioVenta)}</span>
                  <span class="price-ves">${ventaBs}</span>
                </div>
              </div>

              ${marginBannerHtml}
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    // Modo Tabla Compacta
    function renderizarModoTabla(container, items) {
      const tasa = state.tasaBcv > 0 ? state.tasaBcv : 0;

      let html = `
        <div class="table-container">
          <table class="products-table">
            <thead>
              <tr>
                <th style="width:50px;">#ID</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th style="text-align:right;">Costo ($)</th>
                <th style="text-align:right;">Costo (Bs.)</th>
                <th style="text-align:right;">Venta ($)</th>
                <th style="text-align:right;">Venta (Bs.)</th>
                <th style="text-align:right;">Margen ($)</th>
                <th style="text-align:center;">Markup (%)</th>
              </tr>
            </thead>
            <tbody>
      `;

      items.forEach(prod => {
        const tieneCosto = prod.precioCompra !== null && prod.precioCompra > 0;
        const costoUsd = tieneCosto ? formatearUsd(prod.precioCompra) : '<span style="color:#94a3b8;">--</span>';
        const costoBs = tieneCosto && tasa > 0 ? formatearBs(prod.precioCompra * tasa) : '<span style="color:#94a3b8;">--</span>';
        const ventaUsd = formatearUsd(prod.precioVenta);
        const ventaBs = tasa > 0 ? formatearBs(prod.precioVenta * tasa) : 'Calculando...';

        let margenUsdTxt = '<span style="color:#94a3b8;">--</span>';
        let markupTxt = '<span style="color:#94a3b8;">--</span>';

        if (tieneCosto) {
          const color = prod.gananciaUsd >= 0 ? 'var(--accent-green-600)' : 'var(--accent-red-600)';
          margenUsdTxt = `<strong style="color:${color};">${prod.gananciaUsd >= 0 ? '+' : ''}${formatearUsd(prod.gananciaUsd)}</strong>`;
          markupTxt = `<span style="font-weight:800; color:${color};">${prod.gananciaPct >= 0 ? '+' : ''}${prod.gananciaPct.toFixed(1)}%</span>`;
        }

        html += `
          <tr>
            <td style="color:var(--text-light); font-weight:700;">#${prod.id}</td>
            <td style="font-weight:800; color:var(--logo-navy-950);">${escapeHtml(prod.nombre)}</td>
            <td><span class="card-category-badge">${escapeHtml(prod.categoria)}</span></td>
            <td style="text-align:right; font-weight:700; color:#475569;">${costoUsd}</td>
            <td style="text-align:right; color:#64748b; font-size:0.8rem;">${costoBs}</td>
            <td style="text-align:right; font-weight:900; color:var(--accent-green-600);">${ventaUsd}</td>
            <td style="text-align:right; font-weight:700; color:#0369a1; font-size:0.8rem;">${ventaBs}</td>
            <td style="text-align:right;">${margenUsdTxt}</td>
            <td style="text-align:center;">${markupTxt}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    // =========================================================================
    // INICIALIZACIÓN Y EVENTOS
    // =========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Año en footer
      const yearEl = document.getElementById('currentYear');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      // Buscador
      const searchInput = document.getElementById('searchInput');
      const searchClearBtn = document.getElementById('searchClearBtn');

      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.busqueda = e.target.value;
          if (searchClearBtn) {
            searchClearBtn.style.display = state.busqueda ? 'flex' : 'none';
          }
          renderizarVista();
        });

        // Atajo de teclado: presionar '/' para enfocar búsqueda
        window.addEventListener('keydown', (e) => {
          if (e.key === '/' && document.activeElement !== searchInput) {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
          } else if (e.key === 'Escape' && document.activeElement === searchInput) {
            searchInput.value = '';
            state.busqueda = '';
            searchClearBtn.style.display = 'none';
            renderizarVista();
            searchInput.blur();
          }
        });
      }

      if (searchClearBtn && searchInput) {
        searchClearBtn.addEventListener('click', () => {
          searchInput.value = '';
          state.busqueda = '';
          searchClearBtn.style.display = 'none';
          searchInput.focus();
          renderizarVista();
        });
      }

      // Orden
      const sortSelect = document.getElementById('sortSelect');
      if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
          state.orden = e.target.value;
          renderizarVista();
        });
      }

      // Filtro de estado de costo
      document.querySelectorAll('.status-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.status-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.filtroCosto = btn.getAttribute('data-filter');
          renderizarVista();
        });
      });

      // Alternar Vistas (Grid vs Tabla)
      const btnViewGrid = document.getElementById('btnViewGrid');
      const btnViewTable = document.getElementById('btnViewTable');

      if (btnViewGrid && btnViewTable) {
        btnViewGrid.addEventListener('click', () => {
          state.vista = 'grid';
          btnViewGrid.classList.add('active');
          btnViewTable.classList.remove('active');
          renderizarVista();
        });

        btnViewTable.addEventListener('click', () => {
          state.vista = 'table';
          btnViewTable.classList.add('active');
          btnViewGrid.classList.remove('active');
          renderizarVista();
        });
      }

      // Botón Recargar
      const btnReload = document.getElementById('btnReload');
      if (btnReload) {
        btnReload.addEventListener('click', () => {
          cargarProductos();
          obtenerTasaBCV();
        });
      }

      // Cargas iniciales
      obtenerTasaBCV();
      cargarProductos();
    });
  </script>
</body>

</html>
